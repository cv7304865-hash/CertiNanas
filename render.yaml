services:
  - type: web
    name: certinanas
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        value: certinanas
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
    disk:
      name: certinanas-data
      mountPath: /app/backend/uploads
      sizeGB: 1
